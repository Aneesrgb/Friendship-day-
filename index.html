<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day ❤️</title>

<link rel="stylesheet" href="style .css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="hearts"></div>

<div class="container">

<div id="page1" class="page active">

<h1>❤️ Happy Friendship Day ❤️</h1>

<p>Someone has a special surprise for you...</p>

<button onclick="nextPage()">Open Surprise 🎁</button>

</div>

<div id="page2" class="page">

<h2>Do you want to see the surprise? 🥹</h2>

<div class="buttons">

<button onclick="nextPage2()">Yes ❤️</button>

<button onclick="no1()">No 😒</button>

</div>

</div>

<div id="page3" class="page">

<h2>Are You My Best Friend? 🥹❤️</h2>

<div class="buttons">

<button onclick="bestFriend()">Yes ❤️</button>

<button id="noBtn" onclick="no2()">No 😏</button>

</div>

</div>

<div id="page4" class="page">

<h1>💖 Happy Friendship Day 💖</h1>

<p class="message">

Thank you for being the best friend in my life.

You always make my life happier.

May our friendship stay forever. ❤️

</p>

<button onclick="showFireworks()">

Celebrate 🎆

</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
